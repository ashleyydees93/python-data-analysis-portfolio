name: Retail analytics converter tests

on:
  push:
    paths:
      - "retail-sales-analytics-pipeline/**"
      - ".github/workflows/retail-pipeline-tests.yml"
  pull_request:
    paths:
      - "retail-sales-analytics-pipeline/**"
      - ".github/workflows/retail-pipeline-tests.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retail-sales-analytics-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source notebooks and converter
        run: python -m compileall -q scripts notebooks tests
      - name: Run synthetic converter tests (offline)
        run: python -m unittest discover -s tests -v
